<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Coming Soon — THE OLYMP</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{--obsidian:#08080A;--ink:#F5EEDD;--muted:#B9B2A2;--muted-2:#7C7768;--gold-1:#E7C15A;--gold-2:#C8962E;--line:rgba(231,193,90,.16)}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--obsidian);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(70% 55% at 50% 0%, rgba(200,150,46,.14), transparent 70%);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
  .wrap{max-width:520px}
  .emblem{width:96px;height:auto;margin:0 auto 28px;display:block;
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
  .eyebrow{font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-2);margin-bottom:18px}
  h1{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.05;letter-spacing:.02em;margin:0 0 16px;
    color:transparent;background:linear-gradient(180deg,#FDF3C8,#E7C15A 45%,#C8962E);-webkit-background-clip:text;background-clip:text}
  p{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 auto 34px;max-width:420px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:.9rem;letter-spacing:.04em;
    padding:15px 30px;border-radius:6px;text-decoration:none;color:#1A1305;
    background:linear-gradient(180deg,#FBE9B7,#E7C15A 45%,#C8962E);
    box-shadow:0 8px 26px rgba(200,150,46,.28), inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s ease}
  .btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main class="wrap">
  <img class="emblem" src="assets/img3.webp" alt="" aria-hidden="true">
  <div class="eyebrow">THE OLYMP</div>
  <h1>Coming Soon</h1>
  <p>Our contact channels are being set up. Please check back shortly to reach an agent.</p>
  <a class="btn" href="index.html">&larr; Back to home</a>
</main>
</body>
</html>
